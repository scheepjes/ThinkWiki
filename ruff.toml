target-version = "py311"
line-length = 100

[lint]
# This is a defensive proxy: broad `except Exception` at the enrichment,
# parsing, and I/O boundaries is intentional — a lookup or parsing failure must
# never break request passthrough (see DESIGN.txt: "on any failure, skip
# enrichment and forward unchanged").
ignore = ["BLE001", "S110"]

[lint.per-file-ignores]
"tests/*" = ["S101"]
